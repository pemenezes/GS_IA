name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Sem GPU no CI: PyTorch de CPU no lugar da build CUDA do requirements.txt. Os testes não
      # chamam o Ollama nem carregam modelos; os que precisam das páginas gov.br locais são pulados.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^(torch==|--extra-index-url)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Pytest
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -rs
