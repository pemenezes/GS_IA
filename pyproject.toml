[project]
name = "luz-cidada"
version = "0.1.0"
description = "Assistente de direitos do consumidor de energia (RAG + agente com LLM local)"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integracao: testes que exigem Ollama/GPU rodando (excluídos no CI)",
]
