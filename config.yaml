seed: 42
data_referencia: "2026-11-10"      # fixa nos testes (para perguntas dependentes de data)
chunking:
  alvo_tokens: 250
  min_tokens: 60
  max_tokens: 400
  overlap_tokens: 40               # só ao dividir artigos longos
  prefixo_contexto: true           # ex.: "REN 1000/2021 > Art. 362 > § 1º"
embeddings:
  modelo: BAAI/bge-m3
  revisao: 5617a9f61b028005a4858fdac845db406aefb181   # commit do Hugging Face (07/11/2026)
  dispositivo_indexacao: cuda      # fp16
  dispositivo_consulta: cpu
  max_length: 512
  normalizar: true
retrieval:
  # Escolha da Fase 4 (ablação no dev, gabarito v2; critério recall@3 > recall@1 > latência):
  # densa empatou com híbrida+reranker em r@3 (0,938) e r@1 (0,750) e é ~100x mais rápida.
  hibrido: false
  rrf_k: 60
  candidatos: 20
  top_k_final: 3                   # r@5 = r@3 na densa: 3 trechos bastam
  reranker: null                   # não adotado (ver avaliacao/retrieval/ablacao_dev.csv)
  reranker_ablacao:                # modelo testado na ablação (usado quando reranker=True)
    modelo: BAAI/bge-reranker-v2-m3
    revisao: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e   # commit do Hugging Face (08/11/2026)
    dispositivo: cuda              # fp16; CPU levou ~12 s/pergunta, GPU ~0,24 s (cabe com o LLM)
  # Fase 4: cosseno do melhor trecho (densa); ≤ 5% das fora do domínio passam (dev + calibração).
  limiar_recusa: 0.6038            # ver avaliacao/retrieval/limiar.json
  # Correção M (Fase 8B, opção B; avaliacao/busca/variantes.csv): 3 reformulações pelo LLM,
  # RRF, reranker e 5 trechos. O τ vale para o maior cosseno entre a pergunta e as
  # reformulações: no máximo 5% das 28 perguntas fora do domínio passam (test, T2 e calibração).
  multiconsulta:
    k: 5
    tau: 0.6635
llm:
  servidor: ollama
  host: "http://localhost:11434"
  # Fase 5 (C1 no dev): maior acurácia (10/16) e citação correta (12/12) entre os 4 candidatos.
  # Ver avaliacao/geracao/comparacao_modelos.csv.
  modelo: "qwen3:4b-instruct-2507-q4_K_M"
  candidatos:                      # tag -> digest sha256 (tags do Ollama podem ser atualizadas)
    "qwen3:4b-instruct-2507-q4_K_M": 0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
    "qwen3.5:4b-q4_K_M": d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04
    "gemma3:4b-it-q4_K_M": 68ceab7e468a31c988b44d5a4984a0e21f58c4f7158c6ce29c1804babac38df7
    "llama3.2:3b-instruct-q4_K_M": a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
    # Fase 8B (10/11/2026): modelos que raciocinam melhor, testados só no dev.
    "qwen3:4b-instruct-2507-q8_0": aa7252f68dda4d25dfffa65b3760af6d2c3231a140c0060c78d444686d98a374
    "qwen3:4b-thinking-2507-q4_K_M": 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
    "qwen3:8b-q4_K_M": 500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
    "qwen3.5:9b-q4_K_M": 56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90
  quantizacao: Q4_K_M
  num_ctx: 4096
  temperature: 0.0
  top_p: 1.0
  seed: 42
  num_predict: 1024                # Fase 5: 512 cortava o JSON com 3 citações longas (T-010)
  think: false
  keep_alive: "30m"
geracao:
  estruturada: true                # `format` do Ollama com o JSON Schema
agente:
  # Fase 8B: sistema oficial C2+M (multiconsulta, com num_ctx 6144), escolhido pelo Pedro em
  # 12/11/2026 e medido sem viés no T3. O CDEV, escolhido no dev, não se repetiu no T2.
  correcoes_finais: M
  max_passos: 3
  timeout_ferramenta_s: 5
api_paradas:
  base_url: "http://localhost:8001"
  api_key_env: PARADAS_API_KEY
  arquivo_csv: dados/paradas_simuladas.csv    # versionado; gerado por scripts/gerar_paradas.py
  arquivo_db: dados/paradas.sqlite            # fora do git; recriado a partir do CSV
avaliacao:
  split_dev: 0.4
  split_seed: 42
  ic_wilson: 0.95
